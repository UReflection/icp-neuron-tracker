[package]
name = "icp-neuron-tracker"
version = "0.1.1"
edition = "2021"
# Lower bound, not a tested MSRV. Cargo.lock is lockfile version 4, which Cargo below 1.78
# cannot parse — 1.75 fails outright. Verified working on 1.90.0; 1.78 to 1.89 is unverified.
rust-version = "1.78"
description = "Tracks ICP neuron state in local SQLite and projects retirement income from staking rewards"
authors = ["U Reflection Design & Build Inc."]
license = "MIT"
repository = "https://github.com/UReflection/icp-neuron-tracker"

[dependencies]
ic-agent = "0.44"
candid = "0.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite", "rusqlite-bundled"] }
csv = "1.3"

# Dependencies for identity management
k256 = { version = "0.13", features = ["pem", "ecdsa", "pkcs8"] }
sec1 = { version = "0.7", features = ["pem"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }

# Dependencies for interactive setup wizard
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
directories = "5.0"
arboard = "3.6"

[dev-dependencies]
tempfile = "3.10"
